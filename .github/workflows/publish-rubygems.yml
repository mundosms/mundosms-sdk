# Publica el cliente Ruby (ruby/, gema mundosms) en RubyGems con Trusted Publishing (OIDC): sin API keys guardadas.
# - Una etiqueta vX.Y.Z prueba, construye, comprueba y publica. La etiqueta tiene que ser la versión de ruby/lib/mundosms.rb.
# - Lanzado a mano (workflow_dispatch) sin `etiqueta`, solo prueba, construye y comprueba la rama: no publica.
# - Lanzado a mano con `etiqueta` (vX.Y.Z ya creada), construye la gema DESDE esa etiqueta y la publica: sirve para una versión
#   cuya publicación en RubyGems falló, sin mover la etiqueta (los demás registros ya la tienen).
# - La PRIMERA publicación de la gema (Trusted Publisher pendiente) necesita el ID de la cuenta dueña en RubyGems.org: la
#   variable del repositorio RUBYGEMS_OWNER. Con la gema ya creada no hace falta y la variable se borra.
name: Publicar en RubyGems

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta ya creada (vX.Y.Z) que publicar. Vacío: solo prueba y construye la rama."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ruby
    env:
      ETIQUETA: ${{ inputs.etiqueta || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - name: La etiqueta pedida tiene forma de versión
        if: inputs.etiqueta
        working-directory: .
        run: |
          if ! printf '%s' "$ETIQUETA" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then echo "etiqueta no válida: $ETIQUETA"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.etiqueta && format('refs/tags/{0}', inputs.etiqueta) || github.ref }}
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0.9"
      - name: La etiqueta es la versión de la gema
        if: env.ETIQUETA != ''
        run: |
          v=$(ruby -e 'puts File.read("lib/mundosms.rb")[/^  VERSION = "([0-9.]+)"$/, 1]')
          if [ "v$v" != "$ETIQUETA" ]; then echo "La etiqueta $ETIQUETA no es la versión de mundosms.rb ($v)"; exit 1; fi
      - name: Pruebas
        run: ruby -w -Ilib test/test_mundosms.rb
      - name: Construir
        run: gem build mundosms.gemspec
      - name: Comprobar
        run: |
          gem install --local --no-document ./mundosms-*.gem
          cd "$RUNNER_TEMP" && ruby -e 'require "mundosms"; puts "mundosms #{MundoSMS::VERSION}"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: ruby/mundosms-*.gem
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.etiqueta
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: rubygems
      url: https://rubygems.org/gems/mundosms
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
          path: dist/
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0.9"
      - name: Credenciales de RubyGems (OIDC, Trusted Publisher)
        uses: rubygems/configure-rubygems-credentials@c6ca7f4bac0e29c9bde8eeae0a0a986b27efa05f # v2.2.0
        with:
          owner: ${{ vars.RUBYGEMS_OWNER }}
      - name: Publicar
        run: gem push dist/mundosms-*.gem
