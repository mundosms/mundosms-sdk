# Publica el cliente C# (dotnet/MundoSMS.cs, paquete MundoSMS) en NuGet con Trusted Publishing (OIDC): sin API keys guardadas.
# - Una etiqueta vX.Y.Z construye, comprueba y publica. La etiqueta tiene que ser la <Version> de paquetes/nuget/MundoSMS.csproj.
# - Lanzado a mano (workflow_dispatch) desde una rama, solo construye y comprueba: no publica.
name: Publicar en NuGet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.428"
      - name: La etiqueta es la versión del paquete
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' paquetes/nuget/MundoSMS.csproj | head -1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "La etiqueta $GITHUB_REF_NAME no es la versión de MundoSMS.csproj ($v)"; exit 1; fi
      - name: Construir
        run: dotnet pack paquetes/nuget/MundoSMS.csproj -c Release -o dist
      - name: Comprobar
        run: |
          python3 -I - <<'EOF'
          import glob, sys, zipfile
          p = [f for f in glob.glob("dist/*.nupkg")]
          if len(p) != 1 or not glob.glob("dist/*.snupkg"):
              sys.exit("tiene que haber un .nupkg y su .snupkg: %s" % p)
          n = zipfile.ZipFile(p[0]).namelist()
          falta = [x for x in ("lib/net461/MundoSMS.dll", "lib/netstandard2.0/MundoSMS.dll", "lib/net6.0/MundoSMS.dll", "README.md") if x not in n]
          if falta:
              sys.exit("al paquete le falta: %s" % falta)
          print(p[0], "bien")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: nuget
      url: https://www.nuget.org/packages/MundoSMS
    permissions:
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: dist/
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.428"
      - name: Clave temporal de NuGet (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: mundosms
      - name: Publicar
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "dist/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
